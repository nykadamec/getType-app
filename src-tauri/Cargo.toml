[package]
name = "gettype"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gettype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
keyring = { version = "3", features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
hound = "3.5.1"
tauri-plugin-global-shortcut = "2.3.2"
reqwest = { version = "0.13.4", features = ["multipart", "json"] }
arboard = "3.6.1"
enigo = "0.6.1"
# time: tokio::time::sleep pro async čekání (paste delay / restore) — stejný
# runtime, na němž běží tauri::async_runtime, žádné blokování executoru.
tokio = { version = "1", default-features = false, features = ["time"] }
tauri-plugin-autostart = "2.5.1"

# macOS: bílé pozadí NSWindow pod transparentním titlebarem (settings).
# Transparent toolbar ukazuje barvu NSWindow, ne webview — bez toho je
# v dark mode nad bílým stripem tmavý pruh. Viz Tauri docs „Transparent
# Titlebar with Custom Window Background Color".
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSWindow"] }
objc2-av-foundation = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
