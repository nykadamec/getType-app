<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- gettype tray "Waveform mark": 48x48 box -> 16x16 (faktor 1/3).
       5 sloupku #171717, sirka 5/3 = 1.67px, mezera 4/3 = 1.33px,
       vysky [14,26,20,32,16]/3 = [4.67,8.67,6.67,10.67,5.33]px,
       rx 3/3 = 1px, pas 41/3 = 13.67px centrovany (offset 7/6 ~= 1.17px).
       Cernomodra na transparentni = macOS template image (system si prebarvi). -->
  <rect x="1.17" y="5.67" width="1.67" height="4.67" rx="1" fill="#171717"/>
  <rect x="4.17" y="3.67" width="1.67" height="8.67" rx="1" fill="#171717"/>
  <rect x="7.17" y="4.67" width="1.67" height="6.67" rx="1" fill="#171717"/>
  <rect x="10.17" y="2.67" width="1.67" height="10.67" rx="1" fill="#171717"/>
  <rect x="13.17" y="5.33" width="1.67" height="5.33" rx="1" fill="#171717"/>
</svg>
