<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>getType</title>
    <link rel="stylesheet" href="popover.css" />
  </head>
  <body>
    <div id="popover" role="dialog" aria-label="getType">
      <div class="header">
        <div class="brand">
          <span class="waveform" aria-hidden="true">
            <span style="height: 6px"></span>
            <span style="height: 11px"></span>
            <span style="height: 8px"></span>
            <span style="height: 14px"></span>
            <span style="height: 7px"></span>
          </span>
          <div class="app-name">getType</div>
        </div>
        <button id="gear" class="gear" type="button" aria-label="Open Settings" title="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 7h-9" />
            <path d="M14 17H5" />
            <circle cx="17" cy="17" r="3" />
            <circle cx="7" cy="7" r="3" />
          </svg>
        </button>
      </div>

      <div class="status">
        <div class="status-row">
          <span class="dot" aria-hidden="true"></span>
          <span class="status-text">Ready</span>
        </div>
        <p class="hint" id="hint">Hold ⌥ Space and speak. Release to insert text where your cursor is.</p>
      </div>

      <div class="segmented" id="mode" role="group" aria-label="Dictation mode">
        <button type="button" data-mode="push_to_talk" class="active">Push to talk</button>
        <button type="button" data-mode="toggle">Toggle</button>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <div class="footer">
        <div class="model" id="model">Groq · whisper-large-v3-turbo</div>
        <div class="kbd" id="kbd" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="popover.js"></script>
  </body>
</html>
